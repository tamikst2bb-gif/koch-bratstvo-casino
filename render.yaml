services:
  - type: web
    name: koch-bratstvo-casino-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DB_PATH
        value: /tmp/leaderboard.db
