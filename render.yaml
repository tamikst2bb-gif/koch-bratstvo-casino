services:
  - type: web
    name: koch-bratstvo-casino-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    disk:
      name: casino-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BASE_WEB_APP_URL
        value: https://casino-koch-bratstvo.spunkyprawn.chatgpt.site
      - key: ALLOWED_ORIGIN
        value: https://casino-koch-bratstvo.spunkyprawn.chatgpt.site
      - key: DB_PATH
        value: /var/data/leaderboard.db
